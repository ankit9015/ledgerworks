# Local Postgres for Ledgerworks. DEVELOPMENT ONLY: the password below is not a secret.
#
# Pinned resource limits (also recorded in DECISIONS.md, D10). Quote these in every benchmark:
#   CPU:    2.0 cores   (cpus)
#   Memory: 2 GiB       (mem_limit; memswap_limit equals it, so no swap)
# Postgres settings are sized to those limits:
#   shared_buffers=512MB, effective_cache_size=1536MB, work_mem=16MB,
#   maintenance_work_mem=128MB, max_connections=100
#
# pg_stat_statements is preloaded via shared_preload_libraries and created on first init by
# docker/initdb/01-extensions.sql. If the volume already exists, run
#   CREATE EXTENSION IF NOT EXISTS pg_stat_statements;
# once, or recreate it with `docker compose down -v`.
services:
  postgres:
    image: postgres:16
    container_name: ledgerworks-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ledgerworks
      POSTGRES_PASSWORD: ledgerworks
      POSTGRES_DB: ledgerworks
    ports:
      - '5432:5432'
    cpus: '2.0'
    mem_limit: 2g
    memswap_limit: 2g
    shm_size: 256mb
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=1536MB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - max_connections=100
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ledgerworks -d ledgerworks']
      interval: 5s
      timeout: 3s
      retries: 20

  # ---- Observability profile: `docker compose --profile obs up -d` (development only) -------------
  # Prometheus scrapes the API (:9464) and the demo worker (:9465) on the host, Jaeger receives
  # OTLP/HTTP traces on :4318, Grafana (http://localhost:3001, anonymous viewer, dev only) is
  # provisioned from files in ledgerline/observability/.
  prometheus:
    profiles: ['obs']
    image: prom/prometheus:v2.55.1
    container_name: ledgerworks-prometheus
    command: ['--config.file=/etc/prometheus/prometheus.yml', '--storage.tsdb.retention.time=2d']
    ports:
      - '9090:9090'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - ./ledgerline/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  jaeger:
    profiles: ['obs']
    image: jaegertracing/all-in-one:1.62.0
    container_name: ledgerworks-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: 'true'
    ports:
      - '16686:16686'
      - '4318:4318'

  grafana:
    profiles: ['obs']
    image: grafana/grafana:11.3.1
    container_name: ledgerworks-grafana
    depends_on:
      - prometheus
      - postgres
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: ledgerworks-dev
      GF_USERS_DEFAULT_THEME: light
      LEDGERLINE_METRICS_PASSWORD: ${LEDGERLINE_METRICS_PASSWORD:-ledgerline_metrics}
    ports:
      - '3001:3000'
    volumes:
      - ./ledgerline/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ledgerline/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  pgdata:
